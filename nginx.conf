server {
    listen 80;
    server_name _;

    # Servir archivos estáticos compilados de React
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Redirigir peticiones API al backend Flask (gunicorn :5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal de mantenimiento: redirige directamente al blueprint Flask
    # Los assets de API (/api/maintenance/*) ya son capturados por el bloque /api/ de arriba
    location = /maintenance/ {
        proxy_pass http://127.0.0.1:5000/api/maintenance/portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
