services:
  atacante:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctf_atacante_1
    restart: unless-stopped
    ports:
      - "8001:80"
    environment:
      - DATABASE_URL=sqlite:////app/backend/planta_gas.db
    volumes:
      # Montar el socket de Docker para que el backend pueda lanzar
      # contenedores SSH de mantenimiento desde dentro del contenedor
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true
